apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-monitor
  namespace: minecraft
  labels:
    app: mc-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mc-monitor
  template:
    metadata:
      labels:
        app: mc-monitor
    spec:
      containers:
        - name: mc-monitor
          image: itzg/mc-monitor:latest
          args:
            - export-for-prometheus
            - --servers
            - minecraft.minecraft.svc.cluster.local:25565
            - --port
            - "8080"
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: mc-monitor
  namespace: minecraft
  labels:
    app: mc-monitor
spec:
  type: ClusterIP
  selector:
    app: mc-monitor
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mc-monitor
  namespace: minecraft
  labels:
    app: mc-monitor
spec:
  selector:
    matchLabels:
      app: mc-monitor
  namespaceSelector:
    matchNames:
      - minecraft
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s